name: CI - Automatizacion de Pruebas
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-test:
    name: Build, Compile y Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Compilar proyecto
        run: mvn -B clean compile
      - name: Ejecutar pruebas unitarias y BDD
        run: mvn -B test
      - name: Subir reporte de pruebas unitarias
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/
      - name: Subir reporte BDD (Cucumber HTML)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-reports/