name: CI - Automatizacion de Pruebas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Compile y Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilar proyecto
        run: mvn -B clean compile

      - name: Ejecutar pruebas unitarias
        run: mvn -B test

      - name: Subir reporte de pruebas
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/

  acceptance-test-gate:
    name: Acceptance Test Gate (BDD)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Ejecutar Acceptance Tests
        run: mvn -B test -Dtest=RunCucumberTest

      - name: Subir reporte HTML de aceptacion
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-acceptance-tests
          path: target/cucumber-report.html

  deploy-staging:
    name: Deploy a Staging
    needs: acceptance-test-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Dar permisos de ejecucion a los scripts
        run: chmod +x scripts/deploy.sh scripts/rollback.sh

      - name: Ejecutar despliegue a staging
        id: deploy
        run: ./scripts/deploy.sh

      - name: Rollback automatico si el despliegue falla
        if: failure()
        run: ./scripts/rollback.sh

      - name: Subir historial de despliegue como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-despliegue
          path: deploy-history/
